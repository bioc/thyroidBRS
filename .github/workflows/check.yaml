# Builds the package on the three platforms Bioconductor builds on, so a
# break shows up on a push instead of in a release-cycle build report.
on:
  push:
    # Both, so CI keeps running either side of the rename to `devel`.
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # DESCRIPTION promises R >= 4.5, and neither the Bioconductor
          # builders nor the other jobs run it, so this one keeps the promise
          # honest. Raise the floor in DESCRIPTION when this job is dropped.
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # The vignette is R Markdown, so pandoc has to be there before the
      # check runs.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # pak reads biocViews from DESCRIPTION and enables the Bioconductor
      # repositories on its own, which is how SummarizedExperiment, Biobase
      # and BiocStyle get resolved.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

  # main is what Bioconductor builds as devel, so check and BiocCheck it
  # where devel is built: in the official image, which follows Bioconductor
  # onto R-devel when the cycle requires it. A BiocCheck on R release would
  # read the odd y of a devel version (1.1.z) as a release one and fail.
  devel:
    runs-on: ubuntu-latest
    name: Bioc devel (docker) + BiocCheck
    container: bioconductor/bioconductor_docker:devel

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          d <- read.dcf("DESCRIPTION")
          fields <- intersect(c("Depends", "Imports", "LinkingTo", "Suggests"), colnames(d))
          deps <- unlist(lapply(d[1, fields], function(x)
              trimws(sub("\\(.*", "", strsplit(x, ",")[[1]]))))
          deps <- setdiff(deps[nzchar(deps)],
                          c("R", rownames(installed.packages(priority = "base"))))
          BiocManager::install(c(deps, "BiocCheck", "rcmdcheck"),
                               ask = FALSE, update = FALSE)
        shell: Rscript {0}

      # BiocCheck wants the built tarball, not the source directory.
      - name: R CMD build
        run: R CMD build .
        shell: bash

      - name: R CMD check
        run: |
          tarball <- list.files(pattern = "[.]tar[.]gz$")[1]
          rcmdcheck::rcmdcheck(tarball, args = "--no-manual",
                               error_on = "warning")
        shell: Rscript {0}

      # `no-check-bioc-help` skips the maintainer's support-site and
      # mailing-list registration. That is a property of an account, not of
      # the code: it cannot change between commits, Bioconductor verifies it
      # on its own builds, and leaving it in makes this job depend on an
      # external service. It went down three times in one morning and turned
      # the build red each time with nothing wrong in the package.
      - name: BiocCheck
        run: |
          tarball <- list.files(pattern = "[.]tar[.]gz$")[1]
          res <- BiocCheck::BiocCheck(tarball, `no-check-bioc-help` = TRUE)
          cat(length(res$error), "errors,", length(res$warning), "warnings,",
              length(res$note), "notes\n")
          # Notes are expected and listed in the submission issue; errors and
          # warnings are what Bioconductor refuses a package for.
          if (length(res$error) || length(res$warning)) {
              stop("BiocCheck is not clean")
          }
        shell: Rscript {0}
